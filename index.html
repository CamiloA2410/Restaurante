<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta vide</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header">
        <div class="logo"> Pasta vide 🍕 </div>
        <nav class="navbar">

            <a href="#inicio"> Inicio </a>
            <a href="#pedidos"> Pedidos </a>
            <a href="#informacion"> Información </a>

        </nav>
    </header>

    <main>
        <section id="inicio" class="hero">
            <div class="hero-content">
                <h1>El auténtico sabor de la Pasta</h1>
                <p>El mejor precio y sabor gourmet</p>
                <button class="btn-primary">Ordena Ya</button>
            </div>
        </section>

        <section id="destinos" class="servicios">
            <h2>Nuestros Servicios</h2>
            <div class="grid-servicios">
                <article class="card">
                    <img src="img/servicio1.jpg" alt="Comida gourmet">
                    <h3>Italia en tu mesa</h3>
                    <p>Una Experiencia Gastronómica Exclusiva</p>
                </article>
                <article class="card">
                    <img src="img/servicio2.jpg" alt="Pasta Premium">
                    <h3>Pastas Premium</h3>
                    <p>Sabores Exclusivos</p>
                </article>
                <article class="card">
                    <img src="img/servicio3.jpg" alt="Pizzas Italianas">
                    <h3>Pizzas a la leña</h3>
                    <p>Sabores Exclusivos En Base Crujiente</p>
                </article>
            </div>
        </section>

    </main>


</body>

</html>
